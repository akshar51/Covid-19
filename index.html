<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
  </head>
  
  <body>
    <div id="particles-js"></div>
    <div class="container my-5">
      <h1 class="text-center mb-4">COVID-19 Report</h1>
  
      <div class="mb-4">
        <label for="countrySelect" class="form-label">Select Country:</label>
        <select class="form-select" id="country"></select>
      </div>
  
      <div id="stats" class="card shadow p-4 d-none">
        <h4 id="countryName"></h4>
        <p><strong>Confirmed Cases:</strong> <span id="confirmed"></span></p>
        <p><strong>Deaths:</strong> <span id="deaths"></span></p>
        <p><strong>Last Updated:</strong> <span id="lastUpdated"></span></p>
      </div>
    </div>
  
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="./javascript/particle.js"></script>
    <script src="./javascript/script.js"></script>
  </body>
</html>
